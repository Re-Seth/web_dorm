server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + Socket.io → backend (หน้าเว็บเรียก /_api/... ที่ origin เดียวกัน จึงเปิดจากเครื่องอื่นใน LAN ได้ ไม่ติด CORS)
    location /_api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket ของ Socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # รองรับ React Router: path ที่ไม่ใช่ไฟล์จริงให้ส่งกลับ index.html
    # index.html ห้าม cache (หลัง build ใหม่ชื่อไฟล์ใน /assets เปลี่ยน ถ้าใช้ index เก่าจะโหลดหน้าไม่ขึ้น)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ไฟล์ที่ Vite สร้าง (มี hash ในชื่อ) cache ได้นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
