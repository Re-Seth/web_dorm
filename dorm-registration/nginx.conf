server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # รองรับ React Router: path ที่ไม่ใช่ไฟล์จริงให้ส่งกลับ index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ไฟล์ที่ Vite สร้าง (มี hash ในชื่อ) cache ได้นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}