<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>สถาปัตยกรรมของ web_dorm</title>
<desc>ผู้ใช้เปิดผ่านเบราว์เซอร์ไปยัง React SPA ซึ่งเรียก REST และ WebSocket ไปยัง Express monolith ที่ใช้ Prisma เชื่อมกับ SQLite</desc>
<style>
text{font-family:"Noto Sans Thai","Sarabun","Tahoma",sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#FFFFFF"/>

<rect x="240" y="30" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#444441">Browser (ผู้ใช้)</text>
<line x1="340" y1="74" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="110" width="600" height="125" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="60" y="134" fill="#3C3489">Frontend SPA — dorm-registration</text>
<text class="ts" x="620" y="134" text-anchor="end" fill="#534AB7">Docker + Nginx / Vercel</text>
<g fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5">
<rect x="60" y="150" width="176" height="60" rx="8"/><rect x="252" y="150" width="176" height="60" rx="8"/><rect x="444" y="150" width="176" height="60" rx="8"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<text class="th" x="148" y="172" fill="#2C2C2A">Pages</text><text class="ts" x="148" y="192" fill="#5F5E5A">Auth, wizard, rooms</text>
<text class="th" x="340" y="172" fill="#2C2C2A">Client state</text><text class="ts" x="340" y="192" fill="#5F5E5A">Context, localStorage</text>
<text class="th" x="532" y="172" fill="#2C2C2A">API client</text><text class="ts" x="532" y="192" fill="#5F5E5A">axios + Socket.io</text>
</g>

<line x1="532" y1="235" x2="532" y2="288" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="546" y="264" fill="#5F5E5A">REST + WebSocket</text>

<rect x="40" y="290" width="600" height="170" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="60" y="314" fill="#085041">Backend — Express monolith</text>
<text class="ts" x="620" y="314" text-anchor="end" fill="#0F6E56">port 5000</text>
<g fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5">
<rect x="60" y="334" width="126" height="56" rx="8"/><rect x="200" y="334" width="126" height="56" rx="8"/><rect x="340" y="334" width="126" height="56" rx="8"/><rect x="480" y="334" width="126" height="56" rx="8"/><rect x="60" y="404" width="546" height="36" rx="8"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<text class="th" x="123" y="352" fill="#2C2C2A">Auth</text><text class="ts" x="123" y="372" fill="#5F5E5A">JWT, bcrypt</text>
<text class="th" x="263" y="352" fill="#2C2C2A">Users</text><text class="ts" x="263" y="372" fill="#5F5E5A">CRUD, roles</text>
<text class="th" x="403" y="352" fill="#2C2C2A">Maintenance</text><text class="ts" x="403" y="372" fill="#5F5E5A">Repair requests</text>
<text class="th" x="543" y="352" fill="#2C2C2A">Power monitor</text><text class="ts" x="543" y="372" fill="#5F5E5A">Socket.io, 3s tick</text>
<text class="th" x="333" y="422" fill="#2C2C2A">Prisma ORM</text>
</g>

<line x1="333" y1="460" x2="333" y2="498" class="arr" marker-end="url(#arrow)"/>
<rect x="233" y="500" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<g text-anchor="middle" dominant-baseline="central">
<text class="th" x="333" y="518" fill="#444441">SQLite</text><text class="ts" x="333" y="538" fill="#5F5E5A">prisma/dev.db</text>
</g>
</svg>
