services:
  backend:
    build: ./dorm-registration-backend
    container_name: dorm_backend
    environment:
      DATABASE_URL: file:/data/dev.db
      JWT_SECRET: ${JWT_SECRET:-change_me_please}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      PORT: 5000
    volumes:
      - dbdata:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./dorm-registration
      args:
        VITE_API_URL: http://localhost:5000
    container_name: dorm_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  dbdata: