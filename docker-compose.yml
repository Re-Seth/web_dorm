services:
  backend:
    build:
      context: ./dorm-registration-backend
      dockerfile: Dockerfile
    container_name: dorm_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=dorm_secret_key_local_dev
    volumes:
      # บันทึกฐานข้อมูล SQLite ไว้บนโฮสต์ เพื่อให้ข้อมูลไม่สูญหายเมื่อหยุดคอนเทนเนอร์
      - ./dorm-registration-backend/prisma:/app/prisma
    restart: unless-stopped

  frontend:
    build:
      context: ./dorm-registration
      dockerfile: Dockerfile
    container_name: dorm_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped
